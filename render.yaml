services:
  - type: web
    name: calitramparente-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: REPORTS_DB_PATH
        value: /tmp/reports.db
      - key: CORS_ORIGINS
        sync: false
